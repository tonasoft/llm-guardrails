[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-guardrails"
version = "0.1.0"
description = "Drop-in guardrails wrapper for LLM API calls: PII redaction, prompt-injection detection, output schema validation, and usage/latency logging."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "LLM Guardrails Contributors" },
]
keywords = [
    "llm",
    "guardrails",
    "pii",
    "prompt-injection",
    "openai",
    "anthropic",
    "gemini",
    "pydantic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/example/llm-guardrails"
Issues = "https://github.com/example/llm-guardrails/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["llm_guardrails"]
